name: Build and Push Docker Images

on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate tag
        id: tag
        run: |
          DATE=$(TZ='Asia/Taipei' date +%Y-%m-%d)
          SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "value=${DATE}-${SHA}" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/tech-news-agent-backend:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/tech-news-agent-backend:${{ steps.tag.outputs.value }}

      - name: Trigger deploy hook
        run: curl -s "${{ secrets.DEPLOY_HOOK_BACKEND }}"

  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate tag
        id: tag
        run: |
          DATE=$(TZ='Asia/Taipei' date +%Y-%m-%d)
          SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "value=${DATE}-${SHA}" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/tech-news-agent-frontend:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/tech-news-agent-frontend:${{ steps.tag.outputs.value }}

      - name: Trigger deploy hook
        run: curl -s "${{ secrets.DEPLOY_HOOK_FRONTEND }}"
