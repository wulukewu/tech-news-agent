services:
  - type: web
    name: tech-news-agent-backend
    env: python
    region: singapore
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PORT
        value: 8000
      - key: WORKERS
        value: 1
      - key: LOG_LEVEL
        value: info
      - key: TIMEOUT_KEEP_ALIVE
        value: 65
      - key: TIMEOUT_GRACEFUL_SHUTDOWN
        value: 30
      - key: ENABLE_SCHEDULER
        value: true
    # Health check settings
    healthCheck:
      path: /health
      initialDelaySeconds: 60
      periodSeconds: 30
      timeoutSeconds: 10
      failureThreshold: 3
    # Resource limits
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
